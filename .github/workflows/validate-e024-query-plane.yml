name: Validate E024 Query Plane gate

on:
  push:
    branches:
      - experiment/e024-query-plane-gate
    paths:
      - 'experiments/E024-query-plane-token-firewall/**'
      - 'remote-lab/e024-q1-request.json'
      - '.github/workflows/validate-e024-query-plane.yml'
      - '.github/workflows/e024-query-plane-q1.yml'
  pull_request:
    paths:
      - 'experiments/E024-query-plane-token-firewall/**'
      - 'remote-lab/e024-q1-request.json'
      - '.github/workflows/validate-e024-query-plane.yml'
      - '.github/workflows/e024-query-plane-q1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1-zero-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile E024 Q1 assets
        run: |
          python3 -m py_compile experiments/E024-query-plane-token-firewall/validate_q1.py
          python3 -m py_compile experiments/E024-query-plane-token-firewall/run_q1.py
      - name: Validate prospective Q1 corpus and contract
        run: |
          python3 experiments/E024-query-plane-token-firewall/validate_q1.py | tee /tmp/e024-q1-validate.txt
          grep -q '^E024 Q1 prereg validation: PASS$' /tmp/e024-q1-validate.txt
          grep -q '"model_calls": 0' /tmp/e024-q1-validate.txt
          grep -q '"question_count": 9' /tmp/e024-q1-validate.txt
          grep -q '"source_count": 29' /tmp/e024-q1-validate.txt
          grep -q '"prompt_injection_fixture_selected": true' /tmp/e024-q1-validate.txt
          grep -q '"misleading_derived_fixture_selected": true' /tmp/e024-q1-validate.txt
          grep -q '"true_insufficiency_case_present": true' /tmp/e024-q1-validate.txt
          grep -q '"semantic_calls_authorized_by_validator": false' /tmp/e024-q1-validate.txt
          grep -q '"planner_calls": 0' /tmp/e024-q1-validate.txt
      - name: Verify prereg manifest hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'experiments/E024-query-plane-token-firewall/q1-prereg-manifest.json').read_text())
          assert manifest['format']=='E024-Q1-prereg-manifest-v0'
          for rel, expected in manifest['sha256'].items():
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert actual==expected, (rel, actual, expected)
          print('E024 Q1 prereg manifest: PASS')
          PY
      - name: Run Q1 zero-model preflight
        env:
          PYTHONPATH: .
        run: |
          rm -rf remote-lab/out/e024-q1
          python3 experiments/E024-query-plane-token-firewall/run_q1.py | tee /tmp/e024-q1-preflight.txt
          grep -q '"execute_model": false' /tmp/e024-q1-preflight.txt
          grep -q '"model_call_attempts": 0' /tmp/e024-q1-preflight.txt
          grep -q '"question_count": 9' /tmp/e024-q1-preflight.txt
          grep -q '"scheduled_calls": 18' /tmp/e024-q1-preflight.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('remote-lab/out/e024-q1/result.json').read_text())
          assert row['format']=='E024-Q1-v0'
          assert row['execute_model'] is False
          assert row['model_call_attempts']==0
          assert len(row['pairs'])==9
          assert len(row['call_schedule'])==18
          assert row['request']['planner_calls']==0
          assert row['request']['selector_calls']==0
          assert row['request']['retrieval_model_calls']==0
          assert all(pair['context_chars'] >= 7000 for pair in row['pairs'].values())
          print('E024 Q1 zero-model runner: PASS')
          PY
