name: E016 semantic constraint structured gate

on:
  pull_request:
    paths:
      - 'experiments/E016-semantic-constraint-gate/**'
      - 'remote-lab/e016-request.json'
      - '.github/workflows/e016-structured-gate.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E016-semantic-constraint-gate/**'
      - 'remote-lab/e016-request.json'
      - '.github/workflows/e016-structured-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile completed S1 runner
        run: python -m py_compile experiments/E016-semantic-constraint-gate/run_structured_gate.py
      - name: Preserve frozen S1 request and closed result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('remote-lab/e016-request.json').read_text())
          assert row == {
            'request_id': 'e016-s1-e015-20260815-1',
            'stage': 's1_e015',
            'model': 'gpt-5.6-luna',
            'max_model_calls': 1,
            'max_ai_credits': 30,
          }
          assert Path('experiments/E016-semantic-constraint-gate/results-s1-v0.md').exists()
          print('E016-S1-CLOSED validation-only modelCalls=0')
          PY
