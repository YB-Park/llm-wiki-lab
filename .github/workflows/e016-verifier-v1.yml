name: E016 read-only verifier V1

on:
  pull_request:
    paths:
      - 'experiments/E016-semantic-constraint-gate/**'
      - 'remote-lab/e016-verifier-request.json'
      - '.github/workflows/e016-verifier-v1.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E016-semantic-constraint-gate/**'
      - 'remote-lab/e016-verifier-request.json'
      - '.github/workflows/e016-verifier-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile archived verifier runner
        run: python -m py_compile experiments/E016-semantic-constraint-gate/run_verifier_v1.py
      - name: Preserve frozen V1 request and aborted status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('remote-lab/e016-verifier-request.json').read_text())
          assert row == {
            'request_id': 'e016-v1-e015-20260815-1',
            'stage': 'v1_e015_failing_draft',
            'model': 'gpt-5.6-luna',
            'max_model_calls': 1,
            'max_ai_credits': 30,
          }
          text = Path('experiments/E016-semantic-constraint-gate/preregistration-v1-verifier.md').read_text()
          assert 'ABORTED BEFORE VERIFIER MODEL CALL' in text
          print('E016-V1-ABORTED validation-only modelCalls=0')
          PY
