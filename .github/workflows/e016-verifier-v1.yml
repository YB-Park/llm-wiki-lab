name: E016 read-only verifier V1

on:
  pull_request:
    paths:
      - 'experiments/E016-semantic-constraint-gate/**'
      - 'remote-lab/e016-verifier-request.json'
      - '.github/workflows/e016-verifier-v1.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E016-semantic-constraint-gate/**'
      - 'remote-lab/e016-verifier-request.json'
      - '.github/workflows/e016-verifier-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile verifier runner
        run: python -m py_compile experiments/E016-semantic-constraint-gate/run_verifier_v1.py
      - name: Freeze V1 request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('remote-lab/e016-verifier-request.json').read_text())
          assert row == {
            'request_id': 'e016-v1-e015-20260815-1',
            'stage': 'v1_e015_failing_draft',
            'model': 'gpt-5.6-luna',
            'max_model_calls': 1,
            'max_ai_credits': 30,
          }
          print('E016-V1-PRESCORE PASS modelCalls=0')
          PY

  run:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g @github/copilot
      - name: Run E016 verifier V1 exactly once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python experiments/E016-semantic-constraint-gate/run_verifier_v1.py
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e016-v1-${{ github.run_id }}
          path: remote-lab/out/e016-v1/
          if-no-files-found: error
          retention-days: 14
