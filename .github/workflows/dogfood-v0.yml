name: VS Code Dogfood

on:
  push:
    branches:
      - main
      - dogfood/minimal-shell-v0
      - dogfood/vscode-v1-hardening
      - dogfood/git-safety
      - spike/vscode-lm-api-luna
    paths:
      - 'dogfood/**'
      - 'experiments/E020-synthetic-agent-ux/**'
      - '.vscode/**'
      - '.github/workflows/dogfood-v0.yml'
  pull_request:
    paths:
      - 'dogfood/**'
      - 'experiments/E020-synthetic-agent-ux/**'
      - '.vscode/**'
      - '.github/workflows/dogfood-v0.yml'

permissions:
  contents: read

jobs:
  python39-compat:
    name: Python 3.9 bundled-core compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compile and test Python 3.9 core
        run: |
          python3 --version
          python3 -m compileall -q dogfood
          python3 -m unittest discover -s dogfood/tests -v
          tmp="$(mktemp -d)"
          python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" init
          grep -q 'compiled_provider.*disabled' "$tmp/wiki/config.json"
      - name: Bundle shared core and execute it with Python 3.9
        working-directory: dogfood/vscode
        run: |
          node scripts/bundle-core.js
          tmp="$(mktemp -d)"
          PYTHONPATH="$PWD/python" python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" init
          PYTHONPATH="$PWD/python" python3 -c 'from dogfood.llm_wiki.writer_lock import store_writer_lock, serialized_writer; from dogfood.llm_wiki.agent_memory_cli import main as agent_memory_main; from dogfood.llm_wiki.agent_state import read_agent_state; from dogfood.llm_wiki.agent_state_cli import main as agent_state_main; print("PY39-BUNDLED-CORE PASS")'
          test -f python/dogfood/llm_wiki/writer_lock.py
          test -f python/dogfood/llm_wiki/agent_memory_cli.py
          test -f python/dogfood/llm_wiki/agent_state.py
          test -f python/dogfood/llm_wiki/agent_state_cli.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Compile Python core
        run: python3 -m compileall -q dogfood
      - name: Python unit tests
        run: python3 -m unittest discover -s dogfood/tests -v
      - name: CLI smoke
        run: |
          tmp="$(mktemp -d)"
          printf 'alpha cache decision uses cedar quota\n' > "$tmp/a.md"
          python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" init
          python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" ingest "$tmp/a.md"
          python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" search 'cache decision'
          python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" context 'cedar quota'
          test "$(find "$tmp/wiki/raw" -type f | wc -l)" -eq 1
          grep -q 'compiled_provider.*disabled' "$tmp/wiki/config.json"
      - name: E020 synthetic Agent Wiki UX contract (zero model calls)
        run: python3 experiments/E020-synthetic-agent-ux/score_contract.py
      - name: VS Code extension syntax and static boundary checks
        run: |
          node --version
          node --check dogfood/vscode/entry.js
          node --check dogfood/vscode/extension.js
          node --check dogfood/vscode/agent-tools.js
          node --check dogfood/vscode/human-knowledge.js
          node --check dogfood/vscode/git-safety.js
          node --check dogfood/vscode/lm-discovery.js
          node dogfood/vscode/test/static.js
          node dogfood/vscode/test/git-safety.js
          node dogfood/vscode/test/lm-discovery.js
      - name: Install VS Code test/package tooling
        working-directory: dogfood/vscode
        run: npm install --no-audit --no-fund
      - name: VS Code Extension Host integration test
        working-directory: dogfood/vscode
        run: xvfb-run -a npm run test:integration
      - name: Bundle and verify shared Python core
        working-directory: dogfood/vscode
        run: |
          npm run bundle:core
          tmp="$(mktemp -d)"
          PYTHONPATH="$PWD/python" python3 -m dogfood.llm_wiki.cli --root "$tmp/wiki" init
          grep -q 'compiled_provider.*disabled' "$tmp/wiki/config.json"
          test -f python/dogfood/llm_wiki/cli.py
          test -f python/dogfood/llm_wiki/agent_memory_cli.py
          test -f python/dogfood/llm_wiki/agent_state.py
          test -f python/dogfood/llm_wiki/agent_state_cli.py
      - name: Package installable VSIX
        working-directory: dogfood/vscode
        run: |
          npm run package:vsix
          test -s dist/llm-wiki-dogfood.vsix
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/python/dogfood/llm_wiki/cli.py'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/python/dogfood/llm_wiki/agent_memory_cli.py'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/python/dogfood/llm_wiki/agent_state.py'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/python/dogfood/llm_wiki/agent_state_cli.py'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/python/dogfood/llm_wiki/writer_lock.py'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/human-knowledge.js'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/git-safety.js'
          unzip -l dist/llm-wiki-dogfood.vsix | grep -q 'extension/lm-discovery.js'
      - name: Unpack and execute packaged VSIX in Extension Host
        working-directory: dogfood/vscode
        run: |
          rm -rf ../../.wiki-lab
          rm -rf dist/unpacked
          mkdir -p dist/unpacked
          unzip -q dist/llm-wiki-dogfood.vsix -d dist/unpacked
          test -f dist/unpacked/extension/python/dogfood/llm_wiki/cli.py
          test -f dist/unpacked/extension/python/dogfood/llm_wiki/agent_memory_cli.py
          test -f dist/unpacked/extension/python/dogfood/llm_wiki/agent_state.py
          test -f dist/unpacked/extension/python/dogfood/llm_wiki/agent_state_cli.py
          test -f dist/unpacked/extension/python/dogfood/llm_wiki/writer_lock.py
          test -f dist/unpacked/extension/human-knowledge.js
          test -f dist/unpacked/extension/git-safety.js
          test -f dist/unpacked/extension/lm-discovery.js
          xvfb-run -a npm run test:packaged
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: llm-wiki-dogfood-vsix
          path: dogfood/vscode/dist/llm-wiki-dogfood.vsix
          if-no-files-found: error
          retention-days: 14
