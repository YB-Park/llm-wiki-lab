name: E023 generality G1f

on:
  pull_request:
    paths:
      - 'experiments/E023-generality-retrieval-composition/run_g1f.py'
      - 'experiments/E023-generality-retrieval-composition/validate_g1f_execution.py'
      - 'experiments/E023-generality-retrieval-composition/g1f-execution-addendum-v0.md'
      - 'remote-lab/e023-g1f-request.json'
      - '.github/workflows/e023-generality-g1f.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E023-generality-retrieval-composition/run_g1f.py'
      - 'experiments/E023-generality-retrieval-composition/validate_g1f_execution.py'
      - 'experiments/E023-generality-retrieval-composition/g1f-execution-addendum-v0.md'
      - 'remote-lab/e023-g1f-request.json'
      - '.github/workflows/e023-generality-g1f.yml'

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile G1f execution assets
        run: |
          python3 -m py_compile experiments/E023-generality-retrieval-composition/run_g1f.py
          python3 -m py_compile experiments/E023-generality-retrieval-composition/validate_g1f_execution.py
      - name: Validate frozen G1f execution contract
        run: |
          python3 experiments/E023-generality-retrieval-composition/validate_g1f_execution.py \
            | tee /tmp/e023-g1f-execution.txt
          grep -q '^E023 G1f execution contract validation: PASS$' /tmp/e023-g1f-execution.txt
          grep -q '"model_calls": 0' /tmp/e023-g1f-execution.txt
          grep -q '"max_semantic_calls": 16' /tmp/e023-g1f-execution.txt
          grep -q '"counterbalanced_interleaving": true' /tmp/e023-g1f-execution.txt
          grep -q '"shared_context_per_pair_required": true' /tmp/e023-g1f-execution.txt
          grep -q '"semantic_calls_authorized_on_pr": false' /tmp/e023-g1f-execution.txt
          grep -q '"g2_persistence_authorized": false' /tmp/e023-g1f-execution.txt
      - name: Run zero-model G1f preflight
        env:
          PYTHONPATH: .
        run: |
          rm -rf remote-lab/out/e023-g1f
          python3 experiments/E023-generality-retrieval-composition/run_g1f.py \
            | tee /tmp/e023-g1f-preflight.txt
          grep -q '"execute_model": false' /tmp/e023-g1f-preflight.txt
          grep -q '"model_call_attempts": 0' /tmp/e023-g1f-preflight.txt
          grep -q '"semantic_promotion": "NOT_EXECUTED"' /tmp/e023-g1f-preflight.txt
          grep -q '"pair_count": 8' /tmp/e023-g1f-preflight.txt
          grep -q '"scheduled_calls": 16' /tmp/e023-g1f-preflight.txt
          grep -q '"context_identity_contract": true' /tmp/e023-g1f-preflight.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('remote-lab/out/e023-g1f/result.json').read_text())
          assert row['format']=='E023-G1f-v0', row
          assert row['execute_model'] is False, row
          assert row['prereg_merge_sha']=='1e5a3f991d0c3b76552725933149702ff6e53d15', row
          assert row['model_call_attempts']==0, row
          assert row['execution_complete'] is False, row
          assert row['semantic_promotion']=='NOT_EXECUTED', row
          assert row['context_identity_contract'] is True, row
          assert len(row['pairs'])==8, row
          assert len(row['call_schedule'])==16, row
          assert all(len(pair['selected_anchor_ids'])==6 for pair in row['pairs'].values()), row
          assert row['request']['max_model_call_attempts']==16, row
          assert row['request']['planner_calls']==0, row
          assert row['request']['selector_calls']==0, row
          assert row['request']['retrieval_model_calls']==0, row
          PY

  execute:
    if: github.event_name == 'push' && github.event.before == '1e5a3f991d0c3b76552725933149702ff6e53d15'
    permissions:
      actions: read
      contents: write
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install standalone GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Execute frozen G1f paired composition comparison
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python3 experiments/E023-generality-retrieval-composition/run_g1f.py --execute-model
      - name: Upload raw G1f artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e023-g1f-${{ github.run_id }}
          path: remote-lab/out/e023-g1f/
          if-no-files-found: error
          retention-days: 30
      - name: Commit immutable G1f result evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          result=/tmp/e023-g1f-result.json
          cp remote-lab/out/e023-g1f/result.json "$result"

          git fetch origin main
          git checkout -B e023-g1f-evidence origin/main
          evidence_dir="experiments/E023-generality-retrieval-composition/evidence/g1f-run-$RUN_ID"
          test ! -e "$evidence_dir"
          mkdir -p "$evidence_dir"
          cp "$result" "$evidence_dir/result.json"
          sha256sum "$evidence_dir/result.json" > "$evidence_dir/result.sha256"
          python3 - "$SOURCE_SHA" "$RUN_ID" > "$evidence_dir/source.json" <<'PY'
          import json, sys
          source_sha, run_id = sys.argv[1:]
          print(json.dumps({
              'run_id': int(run_id),
              'execution_source_sha': source_sha,
              'prereg_merge_sha': '1e5a3f991d0c3b76552725933149702ff6e53d15',
              'workflow': 'E023 generality G1f',
              'request_id': 'e023-g1f-composition-comparison-v0',
          }, indent=2, sort_keys=True))
          PY
          python3 - "$SOURCE_SHA" "$evidence_dir/result.json" <<'PY'
          import json, sys
          source_sha, path = sys.argv[1:]
          result=json.load(open(path,encoding='utf-8'))
          assert result['format']=='E023-G1f-v0', result
          assert result['execute_model'] is True, result
          assert result['execution_source_sha']==source_sha, result
          assert result['prereg_merge_sha']=='1e5a3f991d0c3b76552725933149702ff6e53d15', result
          assert result['request']['model']=='gpt-5.6-luna', result
          assert result['request']['max_model_call_attempts']==16, result
          assert result['request']['rerolls']==0, result
          assert result['request']['planner_calls']==0, result
          assert result['request']['selector_calls']==0, result
          assert result['request']['retrieval_model_calls']==0, result
          assert result['context_identity_contract'] is True, result
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence_dir"
          git commit -m "Capture frozen E023 G1f run $RUN_ID"
          git push origin HEAD:main
