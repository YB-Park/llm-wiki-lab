name: E017 external real-user corpora

on:
  pull_request:
    paths:
      - 'experiments/E017-external-real-user-corpora/**'
      - 'remote-lab/e017-external-request.json'
      - '.github/workflows/e017-external-real-user.yml'
  push:
    branches: [main]
    paths:
      - 'remote-lab/e017-external-request.json'
      - '.github/workflows/e017-external-real-user.yml'

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install HTML capture parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Compile frozen runner
        run: python -m py_compile experiments/E017-external-real-user-corpora/run_external_corpora.py
      - name: Rebuild all three public corpora and inspect W0/X1 with zero model calls
        env:
          PYTHONPATH: .
        run: python experiments/E017-external-real-user-corpora/run_external_corpora.py
      - name: Upload zero-model preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e017-preflight-${{ github.run_id }}
          path: remote-lab/out/e017-external/
          if-no-files-found: error
          retention-days: 14

  real-user:
    if: github.event_name == 'push'
    permissions:
      contents: read
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install public-corpus and Copilot tooling
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
          npm install -g @github/copilot
      - name: Run exactly three frozen external-corpus Luna attempts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python experiments/E017-external-real-user-corpora/run_external_corpora.py --execute-model
      - name: Upload real-user evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e017-real-user-${{ github.run_id }}
          path: remote-lab/out/e017-external/
          if-no-files-found: error
          retention-days: 14
