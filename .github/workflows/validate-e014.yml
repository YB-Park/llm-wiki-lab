name: Validate and score E014

on:
  push:
    branches:
      - experiment/e014-lexical-granularity
    paths:
      - 'experiments/E014-lexical-retrieval-granularity/**'
      - 'dogfood/**'
      - '.github/workflows/validate-e014.yml'
  pull_request:
    paths:
      - 'experiments/E014-lexical-retrieval-granularity/**'
      - 'dogfood/**'
      - '.github/workflows/validate-e014.yml'

permissions:
  contents: read

jobs:
  prescore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify A1-corrected frozen E014 scorer bytes
        run: |
          cat > /tmp/e014-sha256.txt <<'EOF'
          cbd81df876f6bf42e10118737137be6b5bc24edc9b7a30d72f0e4f88f0500c73  experiments/E014-lexical-retrieval-granularity/generate_corpus.py
          30049ba687d3ee99574184a5eb9271896f0e08778ab28fda6455eaf2a94f2bb8  experiments/E014-lexical-retrieval-granularity/retrieval_core.py
          ea3f5d3c369083660f880a49ebd4d52499ffe36d9c6b3f07b23f4a536e55c710  experiments/E014-lexical-retrieval-granularity/analysis_v0.py
          85905196a600421ff18141d01918dbc96cc7afeabe6dd2b37c546b40da5f7aad  experiments/E014-lexical-retrieval-granularity/validate_prescore.py
          EOF
          sha256sum -c /tmp/e014-sha256.txt
          echo 'E014-FROZEN-BYTES PASS amendment=A1'

      - name: Compile frozen experiment and core
        run: |
          python3 -m compileall -q dogfood experiments/E014-lexical-retrieval-granularity

      - name: Existing core regression tests
        run: python3 -m unittest discover -s dogfood/tests -v

      - name: E014 prescore validation
        working-directory: experiments/E014-lexical-retrieval-granularity
        env:
          PYTHONPATH: ../..
        run: python3 validate_prescore.py

      - name: Record scoring authorization boundary
        run: |
          echo 'E014-PRESCORE-GATE PASS priorGreenRun=31782803222 scoringEnabledAfterPrescore=yes modelCalls=0'

  score:
    if: github.event_name == 'push'
    needs: prescore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reverify frozen bytes immediately before first official score
        run: |
          cat > /tmp/e014-sha256.txt <<'EOF'
          cbd81df876f6bf42e10118737137be6b5bc24edc9b7a30d72f0e4f88f0500c73  experiments/E014-lexical-retrieval-granularity/generate_corpus.py
          30049ba687d3ee99574184a5eb9271896f0e08778ab28fda6455eaf2a94f2bb8  experiments/E014-lexical-retrieval-granularity/retrieval_core.py
          ea3f5d3c369083660f880a49ebd4d52499ffe36d9c6b3f07b23f4a536e55c710  experiments/E014-lexical-retrieval-granularity/analysis_v0.py
          85905196a600421ff18141d01918dbc96cc7afeabe6dd2b37c546b40da5f7aad  experiments/E014-lexical-retrieval-granularity/validate_prescore.py
          EOF
          sha256sum -c /tmp/e014-sha256.txt
          echo 'E014-OFFICIAL-SCORE-START frozenBytes=yes heldoutSha=4dde1977666bf8f7494f5ca688631cfd2bb878272ccc1b7821456127d6778eed'

      - name: Official frozen held-out Stage A score
        working-directory: experiments/E014-lexical-retrieval-granularity
        env:
          PYTHONPATH: ../..
        run: python3 analysis_v0.py --split heldout --out /tmp/e014-stage-a-results.json

      - name: Preserve synthetic scored result artifact
        uses: actions/upload-artifact@v7
        with:
          name: e014-stage-a-heldout-v0
          path: /tmp/e014-stage-a-results.json
          if-no-files-found: error
          retention-days: 30
