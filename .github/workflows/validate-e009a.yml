name: Validate E009A experiment

on:
  push:
    paths:
      - 'experiments/E009-canonical-commit-boundary/**'
      - 'docs/05-future-research-automation-boundary.md'
      - 'docs/06-security-and-handoff-boundary.md'
      - '.github/workflows/validate-e009a.yml'
  pull_request:
    paths:
      - 'experiments/E009-canonical-commit-boundary/**'
      - 'docs/05-future-research-automation-boundary.md'
      - 'docs/06-security-and-handoff-boundary.md'
      - '.github/workflows/validate-e009a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-e009a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate frozen paired corpus T-v1
        run: python3 experiments/E009-canonical-commit-boundary/harness/validate_corpus.py

      - name: Report frozen superficial-label audit
        run: python3 experiments/E009-canonical-commit-boundary/harness/audit_surface_balance.py

      - name: Compile harness
        run: |
          python3 -m py_compile \
            experiments/E009-canonical-commit-boundary/harness/validate_corpus.py \
            experiments/E009-canonical-commit-boundary/harness/audit_surface_balance.py \
            experiments/E009-canonical-commit-boundary/harness/audit_surface_leakage_v1.py \
            experiments/E009-canonical-commit-boundary/harness/copilot_cli.py \
            experiments/E009-canonical-commit-boundary/harness/verifier_contract.py \
            experiments/E009-canonical-commit-boundary/harness/telemetry.py \
            experiments/E009-canonical-commit-boundary/harness/preflight.py \
            experiments/E009-canonical-commit-boundary/harness/archive_incomplete_call_v1.py \
            experiments/E009-canonical-commit-boundary/harness/run_stage_a.py \
            experiments/E009-canonical-commit-boundary/harness/run_stage_a_v1.py \
            experiments/E009-canonical-commit-boundary/harness/export_stage_a_analysis.py

      - name: Test verifier contract containment
        run: python3 experiments/E009-canonical-commit-boundary/harness/verifier_contract.py

      - name: Validate frozen T-v1 call plan
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          root = 'experiments/E009-canonical-commit-boundary'
          manifest = json.load(open(f'{root}/corpus/manifest.json'))
          plan = json.load(open(f'{root}/run-plan-v1.json'))
          rows = [json.loads(line) for line in open(f'{root}/corpus/cases.jsonl') if line.strip()]
          case_ids = {row['case_id'] for row in rows}
          calls = plan['calls']
          assert manifest['corpus_id'] == 'T-v1', manifest
          assert plan['corpus_id'] == manifest['corpus_id'], (plan, manifest)
          assert plan['plan_version'] == 'v1', plan
          assert plan['model'] == 'gpt-5.6-luna', plan
          assert len(calls) == 80, len(calls)
          assert [row['sequence'] for row in calls] == list(range(1,81))
          counts = Counter((row['case_id'], row['pass']) for row in calls)
          assert set(case for case, _ in counts) == case_ids
          assert all(counts[(case_id, p)] == 1 for case_id in case_ids for p in (1,2))
          assert all(row['pass'] in (1,2) for row in calls)
          PY

      - name: Verify prompt metadata isolation
        run: |
          python3 - <<'PY'
          import json, sys
          root = 'experiments/E009-canonical-commit-boundary'
          sys.path.insert(0, f'{root}/harness')
          import run_stage_a
          rows = [json.loads(line) for line in open(f'{root}/corpus/cases.jsonl') if line.strip()]
          for row in rows:
              prompt = run_stage_a.render_prompt(row)
              assert row['case_id'] not in prompt
              assert row['scenario_group'] not in prompt
              assert row['gold_label'] not in prompt
              assert row['primary_class'] not in prompt
              assert row['gold_rationale'] not in prompt
              assert '{{' not in prompt and '}}' not in prompt
          PY

      - name: Smoke-test amended policy semantics and counterfactual cost
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          root = 'experiments/E009-canonical-commit-boundary'
          sys.path.insert(0, f'{root}/harness')
          import run_stage_a_v1  # applies the frozen T-v1 policy amendments
          import run_stage_a as base

          safe_low = {'gold_label':'safe_commit','risk':'low'}
          bad_low = {'gold_label':'unsafe_commit','risk':'low'}
          safe_elev = {'gold_label':'safe_commit','risk':'elevated'}
          bad_elev = {'gold_label':'unsafe_commit','risk':'elevated'}
          safe_high = {'gold_label':'safe_commit','risk':'high'}
          accept = {'valid':True,'decision':'accept'}
          revise = {'valid':True,'decision':'revise'}
          invalid = {'valid':False,'decision':None}

          assert base.policy_action('A0', bad_low, revise, revise)['final'] == 'commit'
          assert base.policy_action('A1', safe_low, accept, revise)['final'] == 'commit'
          assert base.policy_action('A2', safe_low, accept, revise)['final'] == 'quarantine'
          assert base.policy_action('A3', safe_low, accept, revise)['auto_commit'] is True
          assert base.policy_action('A3', bad_low, revise, accept)['review'] is True
          assert base.policy_action('A3', safe_elev, accept, accept)['auto_commit'] is True
          assert base.policy_action('A3', safe_elev, accept, revise)['review'] is True
          assert base.policy_action('A3', bad_elev, accept, accept)['final'] == 'commit'
          assert base.policy_action('A3', safe_high, accept, accept)['review'] is True
          assert base.policy_action('A4', safe_high, revise, revise)['final'] == 'commit'

          rows = [json.loads(line) for line in open(f'{root}/corpus/cases.jsonl') if line.strip()]
          cases = {row['case_id']: row for row in rows}
          dirs = {(case_id, p): Path('/tmp/e009a-nonexistent') / f'{case_id}-p{p}' for case_id in cases for p in (1,2)}
          tel = base.policy_telemetry('A3', dirs, cases)
          expected_calls = sum(1 if c['risk']=='low' else 2 if c['risk']=='elevated' else 0 for c in cases.values())
          assert tel['call_count'] == expected_calls, (tel, expected_calls)
          PY
