name: Validate E004 frozen result

on:
  push:
    branches:
      - experiment/e004-provenance-granularity
    paths:
      - '.github/workflows/score-e004.yml'
      - 'experiments/E004-provenance-granularity/**'
  pull_request:
    paths:
      - '.github/workflows/score-e004.yml'
      - 'experiments/E004-provenance-granularity/**'

permissions:
  contents: read

jobs:
  frozen-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reverify frozen E004 bytes
        run: |
          cat > /tmp/e004-frozen-sha256.txt <<'EOF'
          f13b35577028b8fa0aca32e942f1fa140f51584fc7db5392d7ea67c752d7dd1b  experiments/E004-provenance-granularity/generate_corpus.py
          c7922b38404aac4af0469a79a59ee7f506bb23d04e1d2787141425be57684a3a  experiments/E004-provenance-granularity/provenance_v0.py
          56a8b3f95ab9cddff41a35ecb434c2033a92d36ac0e6462ab26207ae84cd1aad  experiments/E004-provenance-granularity/analysis_v0.py
          8ba66358a05d2485f103db9fccc537d2f6162069589617496f08e6be276d8bfa  experiments/E004-provenance-granularity/validate_prescore.py
          EOF
          sha256sum -c /tmp/e004-frozen-sha256.txt

      - name: Revalidate frozen structure only
        working-directory: experiments/E004-provenance-granularity
        run: python3 validate_prescore.py

      - name: Assert automatic rescoring remains disabled
        run: |
          if grep -nE 'python3[[:space:]]+analysis_v0\.py|analysis_v0\.py[[:space:]]+--out' .github/workflows/score-e004.yml; then
            echo 'E004-FROZEN-RESULT-STOP scorer re-enabled'
            exit 1
          fi
          echo 'E004-FROZEN-RESULT PASS officialScoreRun=31796083458 automaticRescore=disabled modelCalls=0 aiCredits=0'
