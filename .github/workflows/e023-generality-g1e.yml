name: E023 generality G1e

on:
  pull_request:
    paths:
      - 'experiments/E023-generality-retrieval-composition/run_g1e.py'
      - 'experiments/E023-generality-retrieval-composition/validate_g1e_execution.py'
      - 'experiments/E023-generality-retrieval-composition/g1e-execution-addendum-v0.md'
      - 'remote-lab/e023-g1e-request.json'
      - '.github/workflows/e023-generality-g1e.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E023-generality-retrieval-composition/run_g1e.py'
      - 'experiments/E023-generality-retrieval-composition/validate_g1e_execution.py'
      - 'experiments/E023-generality-retrieval-composition/g1e-execution-addendum-v0.md'
      - 'remote-lab/e023-g1e-request.json'
      - '.github/workflows/e023-generality-g1e.yml'

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile G1e execution assets
        run: |
          python3 -m py_compile experiments/E023-generality-retrieval-composition/run_g1e.py
          python3 -m py_compile experiments/E023-generality-retrieval-composition/validate_g1e_execution.py
      - name: Validate frozen G1e execution contract
        run: |
          python3 experiments/E023-generality-retrieval-composition/validate_g1e_execution.py \
            | tee /tmp/e023-g1e-execution.txt
          grep -q '^E023 G1e execution contract validation: PASS$' /tmp/e023-g1e-execution.txt
          grep -q '"model_calls": 0' /tmp/e023-g1e-execution.txt
          grep -q '"max_semantic_calls": 16' /tmp/e023-g1e-execution.txt
          grep -q '"planner_calls": 0' /tmp/e023-g1e-execution.txt
          grep -q '"selector_calls": 0' /tmp/e023-g1e-execution.txt
          grep -q '"semantic_calls_authorized_on_pr": false' /tmp/e023-g1e-execution.txt
      - name: Run zero-model G1e preflight
        env:
          PYTHONPATH: .
        run: |
          rm -rf remote-lab/out/e023-g1e
          python3 experiments/E023-generality-retrieval-composition/run_g1e.py \
            | tee /tmp/e023-g1e-preflight.txt
          grep -q '"execute_model": false' /tmp/e023-g1e-preflight.txt
          grep -q '"model_call_attempts": 0' /tmp/e023-g1e-preflight.txt
          grep -q '"semantic_promotion": "NOT_EXECUTED"' /tmp/e023-g1e-preflight.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('remote-lab/out/e023-g1e/result.json').read_text())
          assert row['format']=='E023-G1e-v0', row
          assert row['execute_model'] is False, row
          assert row['phase0_authority_gate']=='PASS_FROZEN_PR187', row
          assert row['model_call_attempts']==0, row
          assert row['execution_complete'] is False, row
          assert len(row['arms']['A5'])==8, row
          assert len(row['arms']['B6'])==8, row
          assert [len(x['selected_anchor_ids']) for x in row['arms']['A5']]==[5]*8, row
          assert [len(x['selected_anchor_ids']) for x in row['arms']['B6']]==[6]*8, row
          assert row['request']['max_model_call_attempts']==16, row
          assert row['request']['planner_calls']==0, row
          assert row['request']['selector_calls']==0, row
          PY

  execute:
    if: github.event_name == 'push' && github.event.before == 'c674f93728db7d4fe0d8b84328feca34b87fd655'
    permissions:
      actions: read
      contents: write
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install standalone GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Execute frozen G1e A5/B6 semantic comparison
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python3 experiments/E023-generality-retrieval-composition/run_g1e.py --execute-model
      - name: Upload raw G1e artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e023-g1e-${{ github.run_id }}
          path: remote-lab/out/e023-g1e/
          if-no-files-found: error
          retention-days: 30
      - name: Commit immutable G1e result evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          result=/tmp/e023-g1e-result.json
          cp remote-lab/out/e023-g1e/result.json "$result"

          git fetch origin main
          git checkout -B e023-g1e-evidence origin/main
          evidence_dir="experiments/E023-generality-retrieval-composition/evidence/g1e-run-$RUN_ID"
          test ! -e "$evidence_dir"
          mkdir -p "$evidence_dir"
          cp "$result" "$evidence_dir/result.json"
          sha256sum "$evidence_dir/result.json" > "$evidence_dir/result.sha256"
          python3 - "$SOURCE_SHA" "$RUN_ID" > "$evidence_dir/source.json" <<'PY'
          import json, sys
          source_sha, run_id = sys.argv[1:]
          print(json.dumps({
              'run_id': int(run_id),
              'execution_source_sha': source_sha,
              'workflow': 'E023 generality G1e',
              'request_id': 'e023-g1e-exact-bm25-budget-v0',
          }, indent=2, sort_keys=True))
          PY
          python3 - "$SOURCE_SHA" "$evidence_dir/result.json" <<'PY'
          import json, sys
          source_sha, path = sys.argv[1:]
          result=json.load(open(path,encoding='utf-8'))
          assert result['format']=='E023-G1e-v0', result
          assert result['execute_model'] is True, result
          assert result['execution_source_sha']==source_sha, result
          assert result['phase0_authority_gate']=='PASS_FROZEN_PR187', result
          assert result['request']['model']=='gpt-5.6-luna', result
          assert result['request']['max_model_call_attempts']==16, result
          assert result['request']['planner_calls']==0, result
          assert result['request']['selector_calls']==0, result
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence_dir"
          git commit -m "Capture frozen E023 G1e run $RUN_ID"
          git push origin HEAD:main
