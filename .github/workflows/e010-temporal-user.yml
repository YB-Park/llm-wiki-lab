name: E010 temporal user Luna dogfood

on:
  pull_request:
    paths:
      - 'remote-lab/e010_temporal_user.py'
      - 'remote-lab/e010-temporal-request.json'
      - '.github/workflows/e010-temporal-user.yml'
  push:
    branches: [main]
    paths:
      - 'remote-lab/e010_temporal_user.py'
      - 'remote-lab/e010-temporal-request.json'
      - '.github/workflows/e010-temporal-user.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m py_compile remote-lab/e010_temporal_user.py

  run:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g @github/copilot
      - name: Run correction and dispute as a user
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python remote-lab/e010_temporal_user.py
      - name: Upload temporal user evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e010-temporal-user-${{ github.run_id }}
          path: remote-lab/out/e010-temporal-user/
          if-no-files-found: error
          retention-days: 14
