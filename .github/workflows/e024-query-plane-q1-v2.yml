name: E024 Query Plane Q1 v2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'remote-lab/e024-q1-v2-execute.json'

jobs:
  execute:
    if: github.head_ref == 'experiment/e024-query-plane-gate'
    permissions:
      actions: read
      contents: write
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compile frozen v2 runner
        run: python3 -m py_compile experiments/E024-query-plane-token-firewall/run_q1_v2.py
      - name: Install standalone GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Execute frozen paired Q1 v2 comparison
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: |
          rm -rf remote-lab/out/e024-q1-v2
          python3 experiments/E024-query-plane-token-firewall/run_q1_v2.py --execute-model
      - name: Upload raw Q1 v2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e024-q1-v2-${{ github.run_id }}
          path: remote-lab/out/e024-q1-v2/
          if-no-files-found: error
          retention-days: 30
      - name: Commit immutable Q1 v2 evidence to experiment branch
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          result=remote-lab/out/e024-q1-v2/result.json
          test -s "$result"
          source_sha="$(git rev-parse HEAD)"
          cp "$result" /tmp/e024-q1-v2-result.json

          git fetch origin experiment/e024-query-plane-gate
          git checkout -B e024-q1-v2-evidence origin/experiment/e024-query-plane-gate
          evidence_dir="experiments/E024-query-plane-token-firewall/evidence/q1-v2-run-$RUN_ID"
          test ! -e "$evidence_dir"
          mkdir -p "$evidence_dir"
          cp /tmp/e024-q1-v2-result.json "$evidence_dir/result.json"
          sha256sum "$evidence_dir/result.json" > "$evidence_dir/result.sha256"
          python3 - "$source_sha" "$RUN_ID" > "$evidence_dir/source.json" <<'PY'
          import json, sys
          source_sha, run_id = sys.argv[1:]
          print(json.dumps({
              'run_id': int(run_id),
              'execution_source_sha': source_sha,
              'workflow': 'E024 Query Plane Q1 v2',
              'request_id': 'e024-q1-token-firewall-v2',
          }, indent=2, sort_keys=True))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$evidence_dir"
          git commit -m "Capture frozen E024 Q1 v2 run $RUN_ID"
          git push origin HEAD:experiment/e024-query-plane-gate
