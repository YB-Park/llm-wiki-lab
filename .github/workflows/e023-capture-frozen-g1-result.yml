name: Capture frozen E023 G1 result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e023-capture-frozen-g1-result.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: capture-frozen-e023-g1-result
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 7315b858ed5ce764fa81ed131ee17f77c1ea11ae
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Find exact frozen E023 main run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=''
          status=''
          conclusion=''
          for attempt in $(seq 1 30); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow e023-generality-g1.yml \
              --branch main \
              --event push \
              --limit 20 \
              --json databaseId,headSha,status,conclusion)"
            read -r run_id status conclusion < <(python3 - "$TARGET_SHA" "$runs" <<'PY'
          import json, sys
          target = sys.argv[1]
          rows = json.loads(sys.argv[2])
          matches = [row for row in rows if row.get('headSha') == target]
          if len(matches) > 1:
              raise SystemExit(f'multiple_matching_runs:{[row.get("databaseId") for row in matches]}')
          if not matches:
              print('  ')
          else:
              row = matches[0]
              print(row['databaseId'], row['status'], row.get('conclusion') or '')
          PY
            )
            if [ -n "$run_id" ] && [ "$status" = completed ]; then
              break
            fi
            sleep 20
          done
          test -n "$run_id"
          test "$status" = completed
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Found frozen E023 run $run_id conclusion=$conclusion head=$TARGET_SHA"

      - name: Download exact frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/e023-g1
          mkdir -p /tmp/e023-g1
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "e023-g1-$RUN_ID" \
            --dir /tmp/e023-g1
          test -s /tmp/e023-g1/result.json

      - name: Verify and stage immutable research evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
          CONCLUSION: ${{ steps.find.outputs.conclusion }}
        run: |
          set -euo pipefail
          evidence_dir="experiments/E023-generality-retrieval-composition/evidence/run-$RUN_ID"
          test ! -e "$evidence_dir"
          mkdir -p "$evidence_dir"
          cp /tmp/e023-g1/result.json "$evidence_dir/result.json"
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url \
            > "$evidence_dir/run.json"
          python3 - "$TARGET_SHA" "$RUN_ID" "$CONCLUSION" "$evidence_dir/result.json" "$evidence_dir/run.json" <<'PY'
          import json, sys
          target_sha, run_id, expected_conclusion, result_path, run_path = sys.argv[1:]
          result = json.load(open(result_path, encoding='utf-8'))
          run = json.load(open(run_path, encoding='utf-8'))
          assert str(run['databaseId']) == run_id, run
          assert run['headSha'] == target_sha, run
          assert run['status'] == 'completed', run
          assert run['conclusion'] == expected_conclusion, run
          assert result['format'] == 'E023-G1-v0', result
          assert result['execute_model'] is True, result
          assert result['request']['request_id'] == 'e023-g1-retrieval-composition-v0', result
          assert result['request']['model'] == 'gpt-5.6-luna', result
          assert len(result['arms']['A']) == 10, result
          assert len(result['arms']['C']) == 10, result
          PY
          sha256sum "$evidence_dir/result.json" > "$evidence_dir/result.sha256"

      - name: Commit captured evidence to main
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "experiments/E023-generality-retrieval-composition/evidence/run-$RUN_ID"
          git commit -m "Capture frozen E023 G1 run $RUN_ID"
          git push origin HEAD:main
