name: Apply 0.1.16 UX release patch

on:
  push:
    branches:
      - agent/release-ux-foundation-0.1.16
    paths:
      - '.github/ux-release-016-patch.py'
      - '.github/workflows/ux-release-016-patch.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/ux-release-016-patch.py'
      - '.github/workflows/ux-release-016-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/release-ux-foundation-0.1.16
          fetch-depth: 0
      - name: Fix reviewed patch marker and apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/ux-release-016-patch.py')
          text = p.read_text(encoding='utf-8')
          bad = "must('register-lineage-tool', agentTools.includes('vscode.lm.registerTool(RESOLVE_LINEAGE_TOOL'));\\n"
          good = "must('register-lineage-tool', agentTools.includes('vscode.lm.registerTool(RESOLVE_LINEAGE_TOOL')));\\n"
          if bad not in text:
              raise SystemExit('reviewed static marker not found')
          p.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
          python3 .github/ux-release-016-patch.py
      - name: Validate patched release files before commit
        run: |
          node --check dogfood/vscode/agent-tools.js
          node --check dogfood/vscode/entry.js
          node dogfood/vscode/test/static.js
          python3 experiments/E020-synthetic-agent-ux/score_contract.py
          test ! -e .github/ux-release-016-patch.py
          test ! -e .github/workflows/ux-release-016-patch.yml
          git diff --check
      - name: Commit final release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Finish 0.1.16 release UX"
          git push origin HEAD:agent/release-ux-foundation-0.1.16
