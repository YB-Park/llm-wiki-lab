name: Observe frozen E023 G1c run

on:
  pull_request:
    paths:
      - '.github/workflows/e023-observe-g1c-run.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/e023-observe-g1c-run.yml'

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert observer is zero-model
        run: |
          grep -q "SOURCE_SHA='987ee7ec615f7eb869be59f14a1928a3811baeed'" .github/workflows/e023-observe-g1c-run.yml
          test ! -e remote-lab/e023-g1c-observer-request.json
          ! grep -q 'copilot-requests: write' .github/workflows/e023-observe-g1c-run.yml
          ! grep -q -- '--execute-model' .github/workflows/e023-observe-g1c-run.yml

  observe-and-salvage:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: '987ee7ec615f7eb869be59f14a1928a3811baeed'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Locate exactly one frozen G1c main-push run
        id: locate
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'E023 generality G1c' \
            --branch main \
            --event push \
            --limit 30 \
            --json databaseId,headSha,status,conclusion,url,createdAt,updatedAt \
            > /tmp/g1c-runs.json
          python3 - <<'PY' >/tmp/g1c-run-id
          import json, os
          rows=json.load(open('/tmp/g1c-runs.json',encoding='utf-8'))
          matched=[r for r in rows if r['headSha']==os.environ['SOURCE_SHA']]
          assert len(matched)==1, matched
          print(matched[0]['databaseId'])
          PY
          run_id=$(cat /tmp/g1c-run-id)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Wait for existing run only
        run: |
          set -euo pipefail
          gh run watch "${{ steps.locate.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --interval 10 --exit-status || true
      - name: Capture run metadata and existing artifact if available
        run: |
          set -euo pipefail
          run_id='${{ steps.locate.outputs.run_id }}'
          mkdir -p /tmp/g1c-observed
          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url,jobs \
            > /tmp/g1c-observed/run.json
          python3 - <<'PY'
          import json, os
          row=json.load(open('/tmp/g1c-observed/run.json',encoding='utf-8'))
          assert row['headSha']==os.environ['SOURCE_SHA'], row
          assert row['status']=='completed', row
          PY
          mkdir -p /tmp/g1c-artifact
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "e023-g1c-$run_id" --dir /tmp/g1c-artifact; then
            test -s /tmp/g1c-artifact/result.json
            cp /tmp/g1c-artifact/result.json /tmp/g1c-observed/result.json
            sha256sum /tmp/g1c-observed/result.json > /tmp/g1c-observed/result.sha256
          fi
      - name: Salvage immutable evidence only if original capture is absent
        run: |
          set -euo pipefail
          run_id='${{ steps.locate.outputs.run_id }}'
          git fetch origin main
          git checkout -B e023-g1c-observer origin/main
          evidence_dir="experiments/E023-generality-retrieval-composition/evidence/g1c-run-$run_id"
          if test -e "$evidence_dir"; then
            echo 'Original G1c workflow already captured evidence; observer is a no-op.'
            exit 0
          fi
          mkdir -p "$evidence_dir"
          cp /tmp/g1c-observed/run.json "$evidence_dir/run.json"
          if test -s /tmp/g1c-observed/result.json; then
            cp /tmp/g1c-observed/result.json "$evidence_dir/result.json"
            cp /tmp/g1c-observed/result.sha256 "$evidence_dir/result.sha256"
          else
            printf '%s\n' 'No e023-g1c artifact was available from the frozen run. This records infrastructure/run metadata only; no semantic rerun was performed.' > "$evidence_dir/NO_RESULT_ARTIFACT.txt"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence_dir"
          git commit -m "Observe frozen E023 G1c run $run_id"
          git push origin HEAD:main
