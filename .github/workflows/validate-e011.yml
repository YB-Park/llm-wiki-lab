name: Validate E011 prescore
on:
  push:
    paths: ['experiments/E011-persistent-compilation-value-gate/**','.github/workflows/validate-e011.yml']
  pull_request:
    paths: ['experiments/E011-persistent-compilation-value-gate/**','.github/workflows/validate-e011.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate frozen E011 A1 fixture
        run: python3 experiments/E011-persistent-compilation-value-gate/validate_frozen_a1.py
      - name: Compile scored path
        run: python3 -m py_compile experiments/E011-persistent-compilation-value-gate/json_transport.py experiments/E011-persistent-compilation-value-gate/stage1a_core.py experiments/E011-persistent-compilation-value-gate/preflight.py experiments/E011-persistent-compilation-value-gate/run_stage_1a.py experiments/E011-persistent-compilation-value-gate/analysis_stage1a.py
