name: Validate E012 prescore

on:
  push:
    branches: [main]
    paths:
      - 'experiments/E012-reuse-update-maintenance/**'
      - '.github/workflows/validate-e012.yml'
  pull_request:
    paths:
      - 'experiments/E012-reuse-update-maintenance/**'
      - '.github/workflows/validate-e012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile E012 deterministic tools
        run: |
          python3 -m py_compile \
            experiments/E012-reuse-update-maintenance/generate_corpus.py \
            experiments/E012-reuse-update-maintenance/core.py \
            experiments/E012-reuse-update-maintenance/validate_prescore.py
      - name: Validate E012 corpus and semantics
        working-directory: experiments/E012-reuse-update-maintenance
        run: python3 validate_prescore.py
