name: Validate E014 R1 prescore

on:
  push:
    branches:
      - experiment/e014-r1-rank-expand
    paths:
      - 'experiments/E014-r1-rank-expand/**'
      - 'dogfood/**'
      - '.github/workflows/prescore-e014-r1.yml'
  pull_request:
    paths:
      - 'experiments/E014-r1-rank-expand/**'
      - 'dogfood/**'
      - '.github/workflows/prescore-e014-r1.yml'

permissions:
  contents: read

jobs:
  prescore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify frozen R1 score-affecting bytes
        run: |
          cat > /tmp/e014-r1-frozen-sha256.txt <<'EOF'
          82667717662d1a84e874d133e98d37cfb80ea9fce12fb129c3115ff08e94ed97  experiments/E014-r1-rank-expand/generate_corpus.py
          1821a9e16d665a95cfa0d1d0edf4b6790d0ced2d00d47b784b7ac7218cb0c7bf  experiments/E014-r1-rank-expand/retrieval_r1.py
          2db4b66ca2ad7a94038f60258d55d1b2ce6cdaeb5770b7821ea26d7b2c945ca2  experiments/E014-r1-rank-expand/analysis_r1.py
          EOF
          sha256sum -c /tmp/e014-r1-frozen-sha256.txt
          echo 'E014-R1-FROZEN-BYTES PASS corpusSha=f3126cc8e61455c4b962a7f2efb7505003ec92767f342a4eefb43f105348b442'

      - name: Compile R1 and current core
        run: python3 -m compileall -q dogfood experiments/E014-r1-rank-expand

      - name: Existing core regression tests
        run: python3 -m unittest discover -s dogfood/tests -v

      - name: R1 structural prescore validation only
        working-directory: experiments/E014-r1-rank-expand
        env:
          PYTHONPATH: ../..
        run: python3 validate_prescore.py

      - name: Assert prescore workflow cannot score held-out R1
        run: |
          if grep -nE 'python3[[:space:]]+analysis_r1\.py|analysis_r1\.py[[:space:]]+--out' .github/workflows/prescore-e014-r1.yml; then
            echo 'E014-R1-PRESCORE-STOP scoring command present before authorization'
            exit 1
          fi
          echo 'E014-R1-PRESCORE-ONLY heldoutScoring=disabled modelCalls=0'
