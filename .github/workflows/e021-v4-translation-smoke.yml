name: E021 v4 Translation Smoke

on:
  pull_request:
    paths:
      - 'experiments/E021-v4-translation-smoke/**'
      - '.github/workflows/e021-v4-translation-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E021-v4-translation-smoke/**'
      - '.github/workflows/e021-v4-translation-smoke.yml'

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile runner
        run: python -m py_compile experiments/E021-v4-translation-smoke/run_e021.py
      - name: Zero-model frozen-contract preflight
        run: python experiments/E021-v4-translation-smoke/run_e021.py
      - name: Assert zero calls and exact budget
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('remote-lab/out/e021-v4-translation-smoke/result.json').read_text())
          assert row['status'] == 'PREFLIGHT_PASS', row
          assert row['models'] == ['gpt-5.4', 'claude-sonnet-4.6'], row
          assert row['max_calls'] == 2, row
          assert row['model_calls'] == 0, row
          assert row['semantic_rerolls'] == 0, row
          print('E021-PREFLIGHT PASS models=2 max_calls=2 model_calls=0 rerolls=0')
          PY
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e021-preflight-${{ github.run_id }}
          path: remote-lab/out/e021-v4-translation-smoke/
          if-no-files-found: error
          retention-days: 14

  smoke:
    if: github.event_name == 'push'
    permissions:
      contents: read
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g @github/copilot
      - name: Run exactly two frozen main-model translation calls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E021_EXECUTE_MODEL: '1'
        run: python experiments/E021-v4-translation-smoke/run_e021.py
      - name: Upload E021 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e021-v4-translation-${{ github.run_id }}
          path: remote-lab/out/e021-v4-translation-smoke/
          if-no-files-found: error
          retention-days: 14
