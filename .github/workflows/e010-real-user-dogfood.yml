name: E010 real-user Luna dogfood

on:
  pull_request:
    paths:
      - 'experiments/E010-vscode-dogfood/real_user_dogfood.py'
      - 'remote-lab/e010-user-request.json'
      - '.github/workflows/e010-real-user-dogfood.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/E010-vscode-dogfood/real_user_dogfood.py'
      - 'remote-lab/e010-user-request.json'
      - '.github/workflows/e010-real-user-dogfood.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile bounded user runner
        run: python -m py_compile experiments/E010-vscode-dogfood/real_user_dogfood.py
      - name: Validate request shape without model calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('remote-lab/e010-user-request.json').read_text())
          assert set(row) == {'request_id','model','max_ai_credits','max_model_calls'}
          assert row['model'] == 'gpt-5.6-luna'
          assert row['max_ai_credits'] == 30
          assert row['max_model_calls'] == 6
          print('E010-REAL-USER-PRESCORE PASS modelCalls=0')
          PY

  run:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Show runtime versions
        run: |
          python --version
          copilot --version
      - name: Run actual Wiki + Luna user-like dogfood
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python experiments/E010-vscode-dogfood/real_user_dogfood.py
      - name: Show compact result
        if: always()
        run: |
          test -f remote-lab/out/e010-user/result.md && cat remote-lab/out/e010-user/result.md || true
      - name: Upload full user-dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e010-real-user-${{ github.run_id }}
          path: remote-lab/out/e010-user/
          if-no-files-found: error
          retention-days: 14
